version: '3.8'
# Optional: Docker-based infrastructure for development.
# The production deploy script (deploy_learningpack.sh) uses native services instead.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PostgreSQL - use this if the production server doesn't have PostgreSQL installed natively
  # If PostgreSQL is already running on the host, comment this out and connect to it instead
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: school_mgmt
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoolpass123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
